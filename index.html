<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>淘金币赛车 · 配置托管</title>
<style>
  :root{color-scheme:light}
  body{margin:0;padding:28px 20px;font:15px/1.7 -apple-system,"PingFang SC",sans-serif;color:#1a1a1a;background:#fafafa}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:19px;margin:0 0 4px}
  p.sub{margin:0 0 20px;color:#666;font-size:13px}
  .card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:16px 18px;margin-bottom:14px}
  h2{font-size:14px;margin:0 0 10px;font-weight:500}
  code{font:12px/1.6 ui-monospace,Menlo,monospace;background:#f2f2f2;padding:2px 6px;border-radius:4px;word-break:break-all}
  ul{margin:6px 0 0;padding-left:18px}
  li{margin:4px 0;font-size:13px}
  .ok{color:#1d7a4a}.mute{color:#888}
  a{color:#0b64c4;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>淘金币赛车 · 配置托管</h1>
  <p class="sub">静态文件服务，供 iOS 快捷指令读取。无 CDN 长缓存，改完即时生效。</p>

  <div class="card">
    <h2>端点</h2>
    <ul>
      <li><code id="p1">/nock.json</code> — 任务配置</li>
      <li><code id="p2">/tb.js</code> — 队列生成引擎</li>
      <li><code id="p3">/empty.txt</code> — 占位（旧更新通道，故意留空）</li>
    </ul>
  </div>

  <div class="card">
    <h2>自检</h2>
    <p class="mute" id="stat">检测中…</p>
  </div>
</div>
<script>
(function(){
  var base = location.origin;
  ['p1','p2','p3'].forEach(function(id,i){
    var path = ['/nock.json','/tb.js','/empty.txt'][i];
    document.getElementById(id).textContent = base + path;
  });
  fetch('/nock.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
    var n = (d.taskData && d.taskData['赚话费'] && d.taskData['赚话费'].task.item || []).length;
    var a = d.activity || {};
    document.getElementById('stat').innerHTML =
      '<span class="ok">✓ 配置可读</span> ｜ 任务 ' + n + ' 条 ｜ 助力步 ' + (a.disableBefore?'关':'开') +
      ' ｜ 推广位 ' + (a.disablePromo?'关':'开') + ' ｜ startFrom=' + (a.startFrom||0);
  }).catch(function(e){
    document.getElementById('stat').textContent = '配置读取失败：' + e;
  });
})();
</script>
</body>
</html>
